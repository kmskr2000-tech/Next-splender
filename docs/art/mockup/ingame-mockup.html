<title>Next-splender 인게임 목업</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: page shell with world switcher, then a 390x844 phone board (portrait game screen). Single dark "lacquer table" look. */
:root{
  --page:#15171a; --board:#1f1a16; --board2:#2a231d; --panel:#332a22; --ink:#f3ece1; --muted:#b9ab97; --line:#4a3d31;
  --gold:#e2b45a; --accent:#e2b45a; --good:#7fd1a0;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--f-ui);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.shell{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
.top{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.top h1{font-family:var(--f-display);font-size:1.4rem;margin:0}
.top p{margin:0;color:var(--muted);max-width:60ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{font:600 13px var(--f-ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#241b10;border-color:var(--gold)}
.tabs button:focus-visible,.card:focus-visible,.act:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* phone */
.phone{width:390px;max-width:100%;height:844px;border-radius:36px;border:8px solid #0b0c0e;overflow:hidden;position:relative;
  background:radial-gradient(120% 80% at 50% 0%,var(--board2),var(--board) 60%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
@media (max-width:430px){.phone{border-width:0;border-radius:0;height:auto;min-height:844px}}
.screen{display:flex;flex-direction:column;gap:8px;padding:12px 10px 0;height:100%}
.hdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.hdr b{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;background:var(--panel);border-radius:99px;padding:2px 10px;color:var(--gold);font-weight:700}
.opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.opp.turn{border-color:var(--gold)}
.opp .nm{display:flex;justify-content:space-between;font-weight:600;font-size:12px}
.opp .nm span:last-child{font-family:var(--f-display);color:var(--gold);font-size:15px;line-height:1}
.mini{display:flex;gap:3px;align-items:center;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:3px;display:inline-grid;place-items:center;font-size:8px;font-weight:700;color:#111}

.rowlbl{font-size:10px;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.special{display:flex;gap:8px;align-items:stretch}
.special .note{flex:1;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.market{display:flex;flex-direction:column;gap:6px}
.tier{display:grid;grid-template-columns:14px repeat(4,minmax(0,1fr));gap:5px;align-items:center}
.tier .t{writing-mode:vertical-rl;font-size:9px;color:var(--muted);letter-spacing:.1em}

.card{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#000;border:2px solid var(--line);cursor:pointer;padding:0;color:inherit;font:inherit;text-align:left}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .band{position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(rgba(10,8,6,.85),rgba(10,8,6,0))}
.card .pts{position:absolute;top:2px;left:5px;font-family:var(--f-display);font-size:20px;line-height:1;color:#fff;text-shadow:0 1px 2px #000}
.card .bonus{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 1px 3px #000}
.card .cost{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column;gap:1px}
.card .cost i{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;font:700 9px var(--f-ui);font-style:normal;color:#111;border:1px solid rgba(0,0,0,.4);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.card .evo{position:absolute;right:3px;bottom:3px;font-size:8px;font-weight:700;background:rgba(10,8,6,.8);border-radius:4px;padding:1px 3px;display:flex;gap:2px;align-items:center}
.card.afford{border-color:var(--good)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card.sm{width:62px;flex:none}
.card.legend{border-color:var(--gold)}
.card.legend::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 12px rgba(226,180,90,.7);pointer-events:none}

.bank{display:flex;justify-content:space-between;gap:4px;padding:6px 4px;background:rgba(0,0,0,.2);border-radius:12px}
.tok{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);min-width:0}
.tok b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-ui);color:#111;border:2px solid rgba(255,255,255,.35);box-shadow:inset 0 -3px 6px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.5)}

.me{margin-top:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px}
.me .r1{display:flex;justify-content:space-between;align-items:center}
.me .score{font-family:var(--f-display);font-size:22px;color:var(--gold)}
.me .score small{font-size:12px;color:var(--muted)}
.me .r2{display:flex;gap:8px;align-items:flex-end}
.bon{display:flex;gap:4px;flex-wrap:wrap}
.bon>span{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--muted)}
.bon .d{width:24px;height:30px;border-radius:5px;display:grid;place-items:center;font:700 12px var(--f-ui);color:#111}
.bon .t{font-size:9px}
.field{margin-left:auto;display:flex;gap:6px;align-items:flex-end}
.field .card{width:56px}
.ready{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--good);color:#0f2418;font-size:9px;font-weight:700;border-radius:99px;padding:1px 6px;white-space:nowrap;z-index:2;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.act{font:600 12px var(--f-ui);color:var(--ink);background:#463829;border:1px solid var(--line);border-radius:10px;height:44px;cursor:pointer}
.act.primary{background:var(--gold);color:#241b10;border-color:var(--gold)}

/* sheet + evolve overlay */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:10}
.sheet .in{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:14px}
.sheet .big{width:150px;flex:none;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:2px solid var(--gold)}
.sheet .big img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.sheet h3{margin:0;font-family:var(--f-display);font-size:18px}
.sheet .kv{font-size:12px;color:var(--muted)}
.sheet .kv b{color:var(--ink)}
.evo-ov{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,rgba(226,180,90,.25),rgba(0,0,0,.85) 70%)}
.evo-ov .stage{position:relative;width:200px;aspect-ratio:3/4}
.evo-ov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;border:3px solid var(--gold)}
.evo-ov .from{animation:fromOut 1.6s ease-in forwards}
.evo-ov .to{opacity:0;animation:toIn 1.6s ease-out .9s forwards}
.evo-ov .burst{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.95),rgba(226,180,90,0) 60%);opacity:0;animation:burst 1s ease-out .7s forwards}
.evo-ov .cap{position:absolute;bottom:-56px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:20px;opacity:0;animation:toIn .6s ease-out 1.8s forwards}
@keyframes fromOut{0%{transform:scale(1);filter:brightness(1)}60%{transform:scale(1.04);filter:brightness(3) saturate(0)}100%{transform:scale(.9);opacity:0;filter:brightness(4)}}
@keyframes toIn{0%{opacity:0;transform:scale(1.15);filter:brightness(3)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
@keyframes burst{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.evo-ov *{animation-duration:.01s!important;animation-delay:0s!important}.ready{animation:none}}
.foot{color:var(--muted);font-size:12px;max-width:62ch;text-align:center}
</style>

<div class="shell">
  <div class="top">
    <h1>인게임 화면 목업</h1>
    <p>세로 390×844 기준. 카드를 누르면 상세가 열리고, 아래 내 필드의 '진화 가능' 카드를 누르면 진화 연출이 나온다.</p>
  </div>
  <div class="tabs" role="group" aria-label="세계관">
    <button id="w-A" data-w="A" aria-pressed="true">A 오행 신수</button>
    <button id="w-B" data-w="B" aria-pressed="false">B 삼국지</button>
    <button id="w-C" data-w="C" aria-pressed="false">C 세계 신화</button>
  </div>
  <div class="phone" id="phone"><div class="screen" id="screen"></div></div>
  <p class="foot">시안이 라인당 3장뿐이라 같은 그림이 티어마다 반복된다. 실제 게임은 카드마다 다른 크리처가 들어간다. C 라인 3단계(펜리르)는 아직 생성 전이라 2단계 그림으로 대신했다.</p>
</div>

     gems:[["불","#d4553f"],["물","#3b7fc4"],["숲","#3fa37a"],["빛","#ece3c4"],["어둠","#3a3446"]],
     line:[["새끼 늑대","C1"],["회색 늑대","C2"],["펜리르","C2"]], evoGem:1},
};
const isDark = c => ["#2b3440","#3a3446","#3b6fc4","#7a5aa8","#3b7fc4"].includes(c);
const txt = c => isDark(c) ? "#fff" : "#111";
// market layout: [tier, points, bonusIdx, cost[[gem,n]...], evoReq?]
const MARKET = [
  [3,4,0,[[1,7]]],[3,5,1,[[2,7],[3,3]]],[3,4,4,[[0,6],[1,3],[3,3]]],[3,3,2,[[0,3],[1,3],[3,5],[4,3]]],
  [2,2,3,[[0,5]],[2,3]],[2,1,1,[[1,2],[2,2],[4,3]],[0,3]],[2,2,4,[[3,5],[1,3]],[1,3]],[2,3,0,[[0,6]],[4,3]],
  [1,0,2,[[0,1],[1,1],[3,1]],[3,3]],[1,1,4,[[2,4]],[1,3]],[1,0,0,[[1,2],[4,1]],[2,3]],[1,0,1,[[3,3]],[0,3]],
];
let world="A", evolved=false;
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild};
function cardHTML(w,tier,pts,b,cost,evo,cls="",tag=""){
  const W=WORLDS[w], img=IMG[W.line[Math.min(tier,3)-1][1]], g=W.gems;
  const pips=cost.map(([i,n])=>`<i style="background:${g[i][1]};color:${txt(g[i][1])}">${n}</i>`).join("");
  const ev=evo?`<span class="evo">진화 <span class="dot" style="background:${g[evo[0]][1]};color:${txt(g[evo[0]][1])}">${evo[1]}</span></span>`:"";
  return `<button class="card ${cls}" ${tag}><img src="${img}" alt=""><span class="band"></span>${pts?`<span class="pts">${pts}</span>`:""}<span class="bonus" style="background:${g[b][1]}"></span><span class="cost">${pips}</span>${ev}</button>`;
}
function render(){
  const W=WORLDS[world], g=W.gems, s=document.getElementById("screen");
  const opp=(nm,sc,bon,tk,rv,turn)=>`<div class="opp ${turn?"turn":""}"><div class="nm"><span>${nm}</span><span>${sc}</span></div>
    <div class="mini">${bon.map((n,i)=>`<span class="dot" style="background:${g[i][1]};color:${txt(g[i][1])}">${n}</span>`).join("")}</div>
    <div class="mini">토큰 ${tk}/10 · 예약 ${rv}</div></div>`;
  const tiers=[3,2,1].map(t=>`<div class="tier"><span class="t">T${t}</span>${MARKET.filter(m=>m[0]===t).map((m,i)=>cardHTML(world,t,m[1],m[2],m[3],m[4],(t===1&&i===0)?"afford":"",`data-m="${MARKET.indexOf(m)}"`)).join("")}</div>`).join("");
  const myStage = evolved?2:1;
  s.innerHTML=`
  <div class="hdr"><span>라운드 <b>9</b> · ${W.name}</span><span class="timer">0:32</span><span>☰</span></div>
  <div class="opps">${opp("호랑이굴",14,[2,3,1,4,2],7,1,true)}${opp("퇴근각",11,[3,1,2,1,3],9,2)}${opp("김대리",8,[1,2,2,2,0],5,0)}</div>
  <div class="rowlbl"><span>희귀 · 전설</span><span>덱 T1 23 · T2 18 · T3 9</span></div>
  <div class="special">
    ${cardHTML(world,2,3,1,[[0,4],[2,4]],null,"sm",`data-s="rare"`)}
    ${cardHTML(world,3,6,3,[[1,5],[3,5],[4,3]],null,"sm legend",`data-s="legend"`)}
    <div class="note"><b style="color:var(--ink)">희귀·전설</b><span>정상 비용 + ${W.wild} 1개. 예약 불가. 보너스 2개.</span></div>
  </div>
  <div class="market">${tiers}</div>
  <div class="bank">${g.map((x,i)=>`<div class="tok"><b style="background:${x[1]};color:${txt(x[1])}">${[4,5,3,5,4][i]}</b>${x[0]}</div>`).join("")}
    <div class="tok"><b style="background:${W.wildColor}">3</b>${W.wild}</div></div>
  <div class="me">
    <div class="r1"><span class="score">${evolved?12:10} <small>/ 21점 · 내 차례</small></span><span class="mini">토큰 6/10 · 예약 1</span></div>
    <div class="r2">
      <div class="bon"><span style="justify-content:flex-end;gap:4px"><span class="t">보너스</span><span class="t">토큰</span></span>${g.map((x,i)=>`<span><span class="d" style="background:${x[1]};color:${txt(x[1])}">${[3,2,1,3,2][i]}</span><span class="t">${[1,2,0,1,0][i]}</span></span>`).join("")}</div>
      <div class="field">
        <div style="position:relative">${evolved?"":`<span class="ready">진화 가능</span>`}${cardHTML(world,myStage,evolved?2:0,W.evoGem,[[0,1]],null,"",`id="evoCard" aria-label="진화 가능 카드"`)}</div>
      </div>
    </div>
    <div class="acts"><button class="act">토큰 3</button><button class="act">토큰 2</button><button class="act">예약</button><button class="act primary">구매</button></div>
  </div>`;
  s.querySelectorAll(".market .card,.special .card").forEach(c=>c.addEventListener("click",()=>openSheet(c)));
  const ec=document.getElementById("evoCard"); if(!evolved) ec.addEventListener("click",playEvo); else ec.addEventListener("click",()=>{evolved=false;render()});
}
function openSheet(c){
  const W=WORLDS[world]; const m=c.dataset.m!=null?MARKET[+c.dataset.m]:null;
  const tier=m?m[0]:(c.dataset.s==="legend"?3:2); const nm=W.line[tier-1][0];
  const ph=document.getElementById("phone");
  const sh=el(`<div class="sheet" role="dialog" aria-label="카드 상세"><div class="in"><div class="big"><img src="${IMG[W.line[tier-1][1]]}" alt=""></div>
    <div class="info"><h3>${nm}</h3><div class="kv">티어 <b>T${tier}</b> · 점수 <b>${m?m[1]:(tier===3?6:3)}</b></div>
    <div class="kv">${m&&m[4]?`진화 조건: <b>${W.gems[m[4][0]][0]} 보너스 ${m[4][1]}</b> 이상`:c.dataset.s?`${W.wild} 1개 추가 필요`:"최종 단계"}</div>
    <div class="acts" style="grid-template-columns:1fr 1fr;margin-top:auto"><button class="act">예약</button><button class="act primary">구매</button></div></div></div></div>`);
  sh.addEventListener("click",e=>{if(e.target===sh)sh.remove()}); ph.appendChild(sh);
}
function playEvo(){
  const W=WORLDS[world], ph=document.getElementById("phone");
  const ov=el(`<div class="evo-ov" role="dialog" aria-label="진화"><div class="stage"><span class="burst"></span><img class="from" src="${IMG[W.line[0][1]]}" alt=""><img class="to" src="${IMG[W.line[1][1]]}" alt=""><div class="cap">${W.line[0][0]} → ${W.line[1][0]}</div></div></div>`);
  ph.appendChild(ov);
  setTimeout(()=>{ov.remove();evolved=true;render()},3200);
  ov.addEventListener("click",()=>{ov.remove();evolved=true;render()});
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  world=b.dataset.w; evolved=false;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b)); render();
}));
render();
</script>
